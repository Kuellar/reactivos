# Build once, then deploy the same dist/ to:
#   1. GitHub Pages (pushes to the `gh-pages` branch, same as `npm run deploy`)
#   2. A server over SFTP (user + password)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID
#   SFTP_HOST        e.g. example.com  (sftp://example.com:2222 also accepted)
#   SFTP_USER
#   SFTP_PASSWORD
#   SFTP_REMOTE_DIR  e.g. public_html/reactivos  (relative = from the user's home)
# Optional:
#   SFTP_PORT        default 22
#   SFTP_KNOWN_HOSTS output of `ssh-keyscan -p <port> <host>` to pin the server key
#
# Firestore rules are NOT deployed here; publish firestore.rules separately.
# See doc/architecture/README.md

name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "doc/**"
      - "**/*.md"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check Firebase secrets
        run: |
          missing=0
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; missing=1; fi
          done
          exit $missing

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  github-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the gh-pages branch
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Push dist/ to gh-pages branch
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

